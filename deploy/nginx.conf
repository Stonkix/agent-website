# /etc/nginx/sites-available/rieltor  →  ln -s в sites-enabled
# После проверки домена: sudo certbot --nginx -d example.ru -d www.example.ru (добавит HTTPS и редирект)

limit_req_zone $binary_remote_addr zone=rieltor_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rieltor_lead:10m rate=10r/m;

upstream rieltor_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name example.ru www.example.ru;

    client_max_body_size 80m;  # пачка фото с телефона в админке

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Статику и фото отдаёт nginx, Python не трогаем
    location /static/ {
        alias /srv/rieltor/app/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/rieltor/media/;
        expires 30d;
        access_log off;
    }

    location = /admin/login {
        limit_req zone=rieltor_login burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://rieltor_app;
    }
    location = /lead {
        limit_req zone=rieltor_lead burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://rieltor_app;
    }
    location / {
        include /etc/nginx/proxy_params;  # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_pass http://rieltor_app;
    }
}
